[project]
name = "hypersteer"
version = "0.1.0"
description = "Steering models with hypernetworks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
    "tiktoken>=0.5.0",
    "wandb>=0.16.0",
    "together>=1.0.0",
    "hydra-colorlog>=1.0.0",
    "hydra-core>=1.3.0",
    "hydra_colorlog>=1.0.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.65.0",
    "datasets>=2.14.0",
    "httpx>=0.24.0",
    "openai>=1.0.0",
    "pyvene>=0.1.0",
    "transformers==4.45.1",
    "adjusttext>=1.0.0",
    "optuna==4.3.0"
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
    "pre-commit>=3.0.0",
    "ai_commit @ git+https://github.com/sidnb13/ai_commit",
]
cpu = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
cu128 = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
cu128-nightly = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
reft = [
    "pyreft>=0.0.1",
]
ray = [
    "hydra-ray-jobs-launcher @ git+https://github.com/sidnb13/hydra#egg=hydra-ray-jobs-launcher&subdirectory=plugins/hydra_ray_jobs_launcher",
]
flash-attn = [
    "flash-attn>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
        { extra = "cu128-nightly" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "extra == 'cpu'" },
    { index = "pytorch-cu128", marker = "extra == 'cu128' and extra != 'cpu'" },
    { index = "pytorch-cu128-nightly", marker = "extra == 'cu128-nightly' and extra != 'cpu' and extra != 'cu128'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "extra == 'cpu'" },
    { index = "pytorch-cu128", marker = "extra == 'cu128' and extra != 'cpu'" },
    { index = "pytorch-cu128-nightly", marker = "extra == 'cu128-nightly' and extra != 'cpu' and extra != 'cu128'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128-nightly"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true
