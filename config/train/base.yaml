defaults:
  - _self_

# Training procedure
batch_size: 16
test_batch_size: 8
gradient_accumulation_steps: 1
n_epochs: 3
n_steps: -1
val_interval: 100
checkpoint_per_step: null

# Optimization parameters
lr: 0.01
warmup_steps: 0
weight_decay: 0.0
optimizer: "adamw"
max_grad_norm: 100.0
adaptive_row_lr: false

# Loss configuration
coeff_latent_l1_loss: 0.005
reconstruction_loss_ratio: 0.0
steering_loss_ratio: 1.0
selection_l1_loss_coeff: 0.001

# Data configuration
binarize_dataset: false
train_on_negative: true
negative_example_ratio: 1.0

# Training environment
debug: false
debug_model: false
save_dir: "./saved_models"
resume_from: null
seed: 42
use_bf16: true
run_eval_suite_at_end: false 