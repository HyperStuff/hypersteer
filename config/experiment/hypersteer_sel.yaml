# @package _global_
# HyperSteer with selection head - inherits from hypersteer, adds selection settings

defaults:
  - hypersteer
  - _self_

model:
  use_selection_head: true
  selection_l1_loss_coeff: 0.3
  compute_sparsity_loss: true
  selection_head_start_temperature: 0.2
  selection_head_threshold: 0.5
  selection_head_add_gumbel_noise: true
  selection_head_straight_through: true
