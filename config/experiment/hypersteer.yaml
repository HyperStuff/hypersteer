# @package _global_
# HyperSteer experiment - only overrides what's different from base

defaults:
  - base
  - override /model: hypersteer
  - override /inference: hypersteer
  - override /evaluate: hypersteer
  - override /train: hypersteer
  - _self_

debug: false

train:
  lr: 8e-5
  n_epochs: 3
  val_interval: 100

model:
  hypernet_type: "attn"
  cross_attn_hidden_layers: 8

wandb:
  project: "hypersteer"
