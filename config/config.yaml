# Base configuration - uses existing config directories for defaults
defaults:
  - _self_
  - dataset: axbench
  - model: base
  - train: base
  - inference: base
  - evaluate: base
  - generate: base
  - wandb: base
  - launcher: base  # Default to base launcher, can be overridden
  - experiment: null  # This will merge at root level when specified
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

debug: false

# Hydra configuration
hydra:
  job:
    env_set:
      OPENAI_DRY_RUN: 0
      TOKENIZERS_PARALLELISM: false

# Allow config overrides
_target_: omegaconf.DictConfig
