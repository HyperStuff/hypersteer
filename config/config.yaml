# Base configuration - uses existing config directories for defaults
defaults:
  - _self_
  - dataset: base
  - model: base
  - train: base
  - inference: base
  - evaluate: base
  - generate: base
  - wandb: base
  - launcher: base  # Default to base launcher, can be overridden
  - experiment: base # Load experiment overrides last
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

# Hydra configuration
hydra:
  job:
    env_set:
      OPENAI_DRY_RUN: 0
      TOKENIZERS_PARALLELISM: false
