# Base configuration - uses existing config directories for defaults
defaults:
  - _self_
  - dataset: axbench
  - model: base
  - train: base
  - inference: base
  - evaluate: base
  - generate: base
  - experiment: null # Merges at root level when specified
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

debug: false
seed: 42
dump_dir: null

# Dataset config comes from config/dataset/axbench.yaml

wandb:
  log: true
  log_code: true
  project: ${oc.env:WANDB_PROJECT,null}
  entity: ${oc.env:WANDB_ENTITY,null}
  run_name: ${oc.env:WANDB_RUN_NAME,null}
  run_id: ${oc.env:WANDB_RUN_ID,null}
  group: ${oc.env:WANDB_GROUP,null}
  tags: ${oc.env:WANDB_TAGS,null}
  notes: ${oc.env:WANDB_NOTES,null}

# Hydra configuration
hydra:
  job:
    env_set:
      HF_HUB_ENABLE_HF_TRANSFER: 1
      OPENAI_DRY_RUN: 0
      TOKENIZERS_PARALLELISM: false
